server:
  port: 8081

spring:
  application:
    name: CHURNINSIGHT_ONE_BK_J17

  datasource:
    url: jdbc:postgresql://localhost:5432/churninsight_db
    username: postgres
    password: 246800
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

security:
  jwt:
    key:
      private: mySecretKeyForJWTTokenGenerationThatIsVeryLongAndSecure12345
      public: myPublicKeyForJWTTokenValidation
    user:
      generator: churninsight-api
    time:
      expiration: 86400000
